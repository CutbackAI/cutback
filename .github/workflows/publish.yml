name: Publish development release
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type cutback-0.1.0.dev2 to publish this pre-alpha release'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pypi-release
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ inputs.confirm == 'cutback-0.1.0.dev2' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.13'
          python-version: '3.11'
          enable-cache: false
      - run: uv sync --locked --all-extras --dev
      - run: uv build
      - run: uv run python scripts/check_release_artifacts.py
      - run: uv run twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/cutback/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - name: Publish reviewed pre-alpha artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
