name: Security checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.13'
          python-version: '3.11'
          enable-cache: false
      - run: uv sync --locked --all-extras --dev
      - run: uv export --all-extras --no-dev --no-emit-project --format requirements-txt --output-file /tmp/runtime.txt
      - run: uv run pip-audit -r /tmp/runtime.txt --no-deps --disable-pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts && npm audit --audit-level=high
        working-directory: web
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279
