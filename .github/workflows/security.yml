name: Security checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.13.6'
          python-version: '3.11.18'
          enable-cache: false
      - run: uv sync --locked --all-extras --dev
      - run: uv run python scripts/check_toolchain.py
      - run: uv export --all-extras --no-dev --no-emit-project --format requirements-txt --output-file /tmp/runtime.txt
      - run: uv run pip-audit -r /tmp/runtime.txt --no-deps --disable-pip --strict
      - run: uv export --project infra/sdk-compat/openai3 --locked --no-emit-project --no-emit-package cutback --format requirements-txt --output-file /tmp/openai3-runtime.txt > /dev/null
      - run: uv run pip-audit -r /tmp/openai3-runtime.txt --no-deps --disable-pip --strict
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts && npm audit --audit-level=high
        working-directory: web
      - run: npm ci --ignore-scripts && npm audit --audit-level=high
        working-directory: packages/js-sdk
      - run: uv run python scripts/audit_training.py
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          output: .cutback/codeql-results
      - name: Reject CodeQL findings before release
        run: python3 scripts/check_codeql_results.py .cutback/codeql-results
