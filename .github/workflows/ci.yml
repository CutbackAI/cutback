name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.13.6'
          python-version: '3.11.18'
          enable-cache: false
      - run: uv sync --locked --all-extras --dev
      - name: Verify pinned infrastructure tools
        run: |
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz --output /tmp/helm.tar.gz
          echo '0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b  /tmp/helm.tar.gz' | sha256sum --check
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          curl --fail --silent --show-error --location https://releases.hashicorp.com/terraform/1.17.0/terraform_1.17.0_linux_amd64.zip --output /tmp/terraform.zip
          echo 'c168cab7c637a8769fdb90089ddd19de701bc6ff8aca64dc2e2185fe46f59f67  /tmp/terraform.zip' | sha256sum --check
          unzip /tmp/terraform.zip -d /tmp/terraform-bin
          sudo install /tmp/terraform-bin/terraform /usr/local/bin/terraform
      - run: uv run pytest tests/contract/test_helm.py -q
      - run: terraform fmt -check && terraform init -backend=false -lockfile=readonly && terraform validate && terraform test
        working-directory: infra/terraform/kubernetes
      - name: Prepare owned image-acceptance database
        run: |
          uv run python infra/compose/prepare.py
          docker compose -f infra/compose/docker-compose.yml up --detach --wait postgres
      - name: Build non-root collector and complete synthetic demo image
        run: docker build --tag cutback-ci-acceptance:${{ github.sha }} --file infra/compose/Dockerfile .
      - name: Verify image demo, encrypted plan recovery and tenant isolation
        run: uv run python scripts/image_acceptance.py --image cutback-ci-acceptance:${{ github.sha }} --isolated-tools --joint-model-context --learned-routing --generated-scenarios --reactive-users
      - name: Remove this job's owned image-acceptance database
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down --volumes --remove-orphans
  legacy-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11.18','3.13.18']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.13.6'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: uv venv /tmp/cutback-legacy --python ${{ matrix.python }}
      - run: uv pip install --python /tmp/cutback-legacy/bin/python '.[instrumentation]' 'openai==1.55.3' 'pydantic==2.10.6' pytest
      - run: /tmp/cutback-legacy/bin/python -m pytest tests/unit/test_legacy_sdk.py tests/unit/test_scanner.py tests/unit/test_scanner_extended.py tests/unit/test_scanner_lazy.py -q
  openai3-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11.18', '3.13.18']
        scope: ['core', 'workflows', 'systems']
    services:
      postgres:
        image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
        env:
          POSTGRES_USER: cutback
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: cutback_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cutback -d cutback_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      CUTBACK_TEST_DATABASE_URL: postgresql+psycopg://cutback:synthetic-ci-only@127.0.0.1:5432/cutback_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.13.6'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: uv sync --project infra/sdk-compat/openai3 --locked --python ${{ matrix.python }}
      - name: Qualify core native contracts
        if: matrix.scope == 'core'
        run: >-
          uv run --project infra/sdk-compat/openai3 --locked python scripts/check.py -q
          tests/unit tests/contract/test_migrations.py
      - name: Qualify native observer, worker and approval boundaries
        if: matrix.scope == 'workflows'
        run: >-
          uv run --project infra/sdk-compat/openai3 --locked python scripts/check.py -q
          tests/integration/test_reviewed_criteria_workflow.py
          tests/integration/test_generated_scenario_workflow.py
          tests/integration/test_agent_generated_scenarios.py
          tests/integration/test_scenario_migrations.py
          tests/end_to_end/test_generated_scenarios_pipeline.py
          tests/integration/test_reactive_users.py
          tests/integration/test_response_model_evidence.py
          tests/integration/test_native_fixture_source.py
          tests/integration/test_native_cache_workflow.py
          tests/integration/test_encrypted_object_retention.py
          tests/integration/test_capture_commit_recovery.py
          tests/integration/test_native_request_profiles.py
          tests/integration/test_native_profile_recovery.py
          tests/integration/test_cache_workload_assessment.py
          tests/integration/test_agent_cache_workload.py
          tests/end_to_end/test_native_profile_dashboard.py
          tests/end_to_end/test_request_reuse_example.py
          tests/end_to_end/test_workload_portfolio_demo.py
          tests/end_to_end/test_workload_campaign_pipeline.py
          tests/integration/test_object_recovery.py
          tests/integration/test_exact_cache_experiment.py
          tests/integration/test_agent_exact_cache.py
          tests/integration/test_cache_call_evidence.py
          tests/integration/test_native_cache_runtime.py
          tests/end_to_end/test_exact_cache_pipeline.py
          tests/integration/test_cache.py
          tests/integration/test_campaign_content.py
          tests/end_to_end/test_native_fixture_pipeline.py
          tests/integration/test_preparation_recovery.py
          tests/integration/test_bootstrap_recovery.py
          tests/integration/test_paired_cases.py
          tests/integration/test_agent_preparation_recovery.py
          tests/end_to_end/test_preparation_recovery_pipeline.py
          tests/end_to_end/test_bootstrap_recovery_pipeline.py
          tests/end_to_end/test_reactive_users_pipeline.py
          tests/integration/test_agent_reviewed_criteria.py
          tests/integration/test_generated_semantic_rubric_workflow.py
          tests/integration/test_learned_routing_workflow.py
          tests/end_to_end/test_learned_routing_sample.py
          tests/end_to_end/test_semantic_rubric_sample.py
          tests/integration/test_criteria_draft_reconciliation.py
          tests/integration/test_reviewed_criteria_migrations.py
          tests/end_to_end/test_reviewed_criteria_pipeline.py
      - name: Qualify execution, gateway and application systems
        if: matrix.scope == 'systems'
        run: >-
          uv run --project infra/sdk-compat/openai3 --locked python scripts/check.py -q
          tests/integration/test_native_episodes.py tests/integration/test_semantic_episodes.py
          tests/integration/test_semantic_episode_controls.py tests/integration/test_episode_lifecycle.py
          tests/integration/test_execution_ledger.py tests/integration/test_campaign_workflow.py
          tests/integration/test_campaign_simple_first.py
          tests/integration/test_campaign_portfolio.py
          tests/integration/test_workload_campaign.py
          tests/integration/test_agent_case_retention.py
          tests/integration/test_campaign_operator.py tests/integration/test_campaign_operator_local.py
          tests/integration/test_campaign_preparation_basis.py
          tests/integration/test_outcome_watches.py tests/integration/test_outcome_watch_controls.py
          tests/integration/test_outcome_watch_draft.py tests/integration/test_outcome_watch_migration.py
          tests/integration/test_outcome_watch_fairness.py
          tests/integration/test_quality_native.py tests/integration/test_agent_workflow.py
          tests/integration/test_modern_accounting.py
          tests/integration/test_native_modern_execution.py
          tests/integration/test_native_input_lineage.py tests/integration/test_dataset_lineage.py
          tests/integration/test_gateway_budget.py tests/integration/test_gateway_native.py
          tests/integration/test_gateway_controls.py tests/integration/test_gateway_lifecycle.py
          tests/integration/test_gateway_expiry.py
          tests/integration/test_gateway_streaming.py
          tests/integration/test_gateway_stream_controls.py
          tests/integration/test_gateway_policy_replay.py
          tests/integration/test_guarded_gateway.py
          tests/integration/test_runtime_guardrail_controls.py
          tests/integration/test_runtime_guardrail_sample.py
          tests/integration/test_guardrail_process.py
          tests/end_to_end/test_gateway_pipeline.py
          tests/integration/test_retrieval_workflow.py
          tests/integration/test_agent_retrieval_workflow.py
          tests/end_to_end/test_retrieval_pipeline.py
          tests/integration/test_compression_workflow.py
          tests/integration/test_joint_context_workflow.py
          tests/integration/test_agent_joint_context_workflow.py
          tests/integration/test_agent_routing_workflow.py
          tests/end_to_end/test_source_routing_sample.py
          tests/integration/test_task_aware_split_workflow.py
          tests/end_to_end/test_compression_pipeline.py
          tests/end_to_end/test_ticket_campaign.py
          tests/integration/test_provider_batch_workflow.py
          tests/integration/test_provider_batch_native.py
          tests/end_to_end/test_provider_batch_sample.py
          tests/integration/test_isolated_episodes.py
          tests/integration/test_guarded_tool_episodes.py
          tests/integration/test_guarded_security_episodes.py
          tests/integration/test_tool_ledger.py
          tests/integration/test_security_episodes.py
  openai3-sdk-required:
    name: openai3-sdk (${{ matrix.python }})
    needs: [openai3-sdk]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      matrix:
        python: ['3.11.18', '3.13.18']
    steps:
      - name: Require every SDK3 shard before the protected compatibility check
        env:
          SDK3_SHARDS_RESULT: ${{ needs.openai3-sdk.result }}
        run: test "$SDK3_SHARDS_RESULT" = success
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11.18', '3.13.18']
    services:
      postgres:
        image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
        env:
          POSTGRES_USER: cutback
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: cutback_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cutback -d cutback_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      CUTBACK_TEST_DATABASE_URL: postgresql+psycopg://cutback:synthetic-ci-only@127.0.0.1:5432/cutback_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.6'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: uv sync --locked --all-extras --dev
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: uv run python scripts/export_openapi.py
      - run: npm ci --ignore-scripts && npm test && npm run check
        working-directory: packages/js-sdk
      - run: npm run test:unit && npm run types && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Install isolated native CPU training runtime
        if: matrix.python == '3.11.18'
        run: UV_PROJECT_ENVIRONMENT=/tmp/cutback-training uv sync --project infra/training --locked --no-dev
      - run: uv run python scripts/check_public_boundary.py
      - run: uv run python scripts/check_toolchain.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/check.py --cov=cutback --cov-report=term-missing --cov-report=xml
        env:
          CUTBACK_TEST_BROWSER: 'true'
          CUTBACK_TEST_LOCAL_STACK: ${{ matrix.python == '3.11.18' && 'true' || 'false' }}
          CUTBACK_TEST_TRAINING_PYTHON: ${{ matrix.python == '3.11.18' && '/tmp/cutback-training/bin/python' || '' }}
      - run: uv run python scripts/check_source_snapshot.py
      - run: uv build
      - run: uv run python scripts/check_release_artifacts.py
      - run: uv run python scripts/check_public_boundary.py --archive dist/cutback-*.whl --archive dist/cutback-*.tar.gz
      - run: uv run twine check dist/*
      - run: uv run python scripts/wheel_smoke.py
  isolated-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
        env:
          POSTGRES_USER: cutback
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: cutback_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cutback -d cutback_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      CUTBACK_TEST_DATABASE_URL: postgresql+psycopg://cutback:synthetic-ci-only@127.0.0.1:5432/cutback_test
      CUTBACK_TEST_TOOL_ISOLATION: 'true'
      CUTBACK_TEST_BROWSER: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.13.6'
          python-version: '3.11.18'
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: uv sync --locked --all-extras --dev
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Build the pinned local tool image without granting the collector a daemon socket
        run: |
          docker build --tag cutback-ci-tools:${{ github.sha }} --file infra/compose/Dockerfile .
          echo "CUTBACK_TEST_TOOL_IMAGE_ID=$(docker image inspect cutback-ci-tools:${{ github.sha }} --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Verify actual kernel controls, separate-process HTTP, native SQL and authenticated UI
        run: uv run python scripts/check.py tests/integration/test_tool_isolation.py tests/end_to_end/test_isolated_tools_pipeline.py tests/end_to_end/test_security_suite_pipeline.py tests/end_to_end/test_guarded_tools_pipeline.py tests/end_to_end/test_guarded_security_pipeline.py tests/end_to_end/test_reviewed_criteria_pipeline.py -q
