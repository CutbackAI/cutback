{{- if and .Values.cache.enabled (not .Values.payloads.enabled) -}}
{{- fail "Application caching requires explicitly authorized encrypted payload storage" -}}
{{- end -}}
{{- if or .Values.toolBroker.execution .Values.toolBroker.containment -}}
{{- if or (not .Values.worker.enabled) (not (hasPrefix "https://" .Values.toolBroker.origin)) (not .Values.toolBroker.projectID) (not .Values.toolBroker.principalID) (not .Values.toolBroker.brokerID) (not .Values.toolBroker.imageID) (not .Values.toolBroker.secretName) -}}
{{- fail "External tool control requires a worker, scoped identities, pinned image, TLS origin and dedicated Secret" -}}
{{- end -}}
{{- if has .Values.toolBroker.secretName (list .Values.secrets.runtime .Values.secrets.experiments .Values.secrets.migration .Values.secrets.notifications) -}}
{{- fail "Tool service credentials require a separate dedicated Secret" -}}
{{- end -}}
{{- if and .Values.toolBroker.execution (or (not .Values.execution.experiments) (not .Values.payloads.enabled)) -}}
{{- fail "Isolated tool execution requires explicitly enabled experiments and encrypted payloads" -}}
{{- end -}}
{{- end -}}
{{- if and .Values.semanticCache.enabled (not .Values.payloads.enabled) -}}
{{- fail "Semantic caching requires explicitly authorized encrypted payload storage" -}}
{{- end -}}
{{- if and .Values.execution.semanticCache (or (not .Values.semanticCache.enabled) (not .Values.worker.enabled)) -}}
{{- fail "Semantic qualification requires an enabled semantic cache and worker" -}}
{{- end -}}
{{- if and .Values.execution.batches (or (not .Values.payloads.enabled) (not .Values.worker.enabled) (not (has "openai" .Values.execution.providers))) -}}
{{- fail "Provider batches require encrypted payloads, an enabled worker and a selected OpenAI key" -}}
{{- end -}}
{{- if and .Values.execution.quality (or (not .Values.payloads.enabled) (not .Values.execution.online) (not .Values.worker.enabled)) -}}
{{- fail "Online content quality requires encrypted payloads, metadata online processing and an enabled worker" -}}
{{- end -}}
{{- if and .Values.execution.online (not .Values.worker.enabled) -}}
{{- fail "Online evaluation requires an explicitly enabled worker" -}}
{{- end -}}
{{- if and .Values.execution.outcomeWatches (not .Values.worker.enabled) -}}
{{- fail "Outcome observations require an explicitly enabled worker" -}}
{{- end -}}
{{- if .Values.notifications.enabled -}}
{{- if or (not .Values.worker.enabled) (not .Values.notifications.registryKey) (not .Values.notifications.signingKeys) -}}
{{- fail "Notifications require a worker, dedicated registry and signing key references" -}}
{{- end -}}
{{- if or (not .Values.secrets.notifications) (eq .Values.secrets.notifications .Values.secrets.runtime) (eq .Values.secrets.notifications .Values.secrets.experiments) (eq .Values.secrets.notifications .Values.secrets.migration) -}}
{{- fail "Notifications require a separate dedicated Secret" -}}
{{- end -}}
{{- $seenSigning := dict -}}
{{- range $item := .Values.notifications.signingKeys -}}
{{- if or (not $item.key) (not (regexMatch "^CUTBACK_WEBHOOK_SECRET_[A-Z0-9_]{1,50}$" $item.name)) -}}
{{- fail "Notification signing names must be dedicated CUTBACK_WEBHOOK_SECRET_ variables" -}}
{{- end -}}
{{- if hasKey $seenSigning $item.name -}}
{{- fail "Notification signing variable names must be unique" -}}
{{- end -}}
{{- $_ := set $seenSigning $item.name true -}}
{{- end -}}
{{- end -}}
{{- if and .Values.execution.schedules (not .Values.execution.experiments) -}}
{{- fail "Schedules require explicit experiment execution enablement" -}}
{{- end -}}
{{- if and .Values.execution.experiments (not .Values.payloads.enabled) -}}
{{- fail "Experiments require explicitly authorized encrypted datasets" -}}
{{- end -}}
{{- if and .Values.training.enabled (not .Values.payloads.enabled) -}}
{{- fail "Training requires explicitly authorized encrypted datasets and artifacts" -}}
{{- end -}}
{{- if and .Values.billing.hostedMode (not .Values.billing.enabled) -}}
{{- fail "Hosted billing enforcement requires an explicitly configured billing service" -}}
{{- end -}}
{{- if .Values.ingress.enabled -}}
{{- $_ := required "Configure the exact ingress proxy IPs or restricted CIDRs" .Values.ingress.trustedProxies -}}
{{- if not (hasPrefix "https://" .Values.publicURL) -}}
{{- fail "TLS ingress requires an explicit https publicURL" -}}
{{- end -}}
{{- if and .Values.network.enabled (not .Values.network.ingressPeers) -}}
{{- fail "Explicitly authorize the TLS ingress controller peers" -}}
{{- end -}}
{{- end -}}
{{- if gt (int .Values.retention.rawDays) (int .Values.retention.aggregateDays) -}}
{{- fail "Raw event retention cannot exceed aggregate retention" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cutback.name" . }}
  labels: {{ include "cutback.labels" . | nindent 4 }}
data:
  CUTBACK_ALLOW_PAYLOADS: {{ .Values.payloads.enabled | quote }}
  CUTBACK_CACHE_ENABLED: {{ .Values.cache.enabled | quote }}
  CUTBACK_SEMANTIC_CACHE_ENABLED: {{ .Values.semanticCache.enabled | quote }}
  CUTBACK_SEMANTIC_CACHE_EXECUTION: {{ .Values.execution.semanticCache | quote }}
  CUTBACK_BATCH_EXECUTION: {{ .Values.execution.batches | quote }}
  CUTBACK_EXPERIMENT_EXECUTION: {{ .Values.execution.experiments | quote }}
  CUTBACK_SCHEDULE_EXECUTION: {{ .Values.execution.schedules | quote }}
  CUTBACK_ONLINE_EXECUTION: {{ .Values.execution.online | quote }}
  CUTBACK_OUTCOME_WATCH_EXECUTION: {{ .Values.execution.outcomeWatches | quote }}
  CUTBACK_QUALITY_EXECUTION: {{ .Values.execution.quality | quote }}
  CUTBACK_WEBHOOK_EXECUTION: {{ .Values.notifications.enabled | quote }}
  CUTBACK_TRAINING_EXECUTION: {{ .Values.training.enabled | quote }}
  CUTBACK_BILLING_ENABLED: {{ .Values.billing.enabled | quote }}
  CUTBACK_BILLING_ALLOW_LIVE: {{ .Values.billing.allowLive | quote }}
  CUTBACK_HOSTED_MODE: {{ .Values.billing.hostedMode | quote }}
  {{- if .Values.billing.enabled }}
  CUTBACK_STRIPE_PRICE_IDS: {{ join "," .Values.billing.priceIDs | quote }}
  {{- if .Values.billing.eventRateUSD }}
  CUTBACK_HOSTED_EVENT_RATE_USD: {{ .Values.billing.eventRateUSD | quote }}
  {{- end }}
  {{- end }}
  CUTBACK_RAW_DAYS: {{ .Values.retention.rawDays | quote }}
  CUTBACK_AGGREGATE_DAYS: {{ .Values.retention.aggregateDays | quote }}
  CUTBACK_TRUSTED_PROXIES: {{ .Values.ingress.trustedProxies | quote }}
  CUTBACK_PUBLIC_URL: {{ .Values.publicURL | quote }}
  {{- if .Values.payloads.enabled }}
  CUTBACK_PAYLOAD_BACKEND: {{ .Values.payloads.backend | quote }}
  {{- if eq .Values.payloads.backend "s3" }}
  CUTBACK_S3_BUCKET: {{ required "payloads.bucket is required for encrypted S3 storage" .Values.payloads.bucket | quote }}
  {{- if .Values.payloads.endpoint }}
  CUTBACK_S3_ENDPOINT: {{ .Values.payloads.endpoint | quote }}
  {{- end }}
  {{- if .Values.payloads.region }}
  CUTBACK_S3_REGION: {{ .Values.payloads.region | quote }}
  {{- end }}
  {{- else }}
  CUTBACK_PAYLOAD_DIR: /var/lib/cutback/payloads
  {{- end }}
  {{- end }}
  {{- if .Values.execution.localEndpoint }}
  CUTBACK_LOCAL_INFERENCE_ENDPOINT: {{ .Values.execution.localEndpoint | quote }}
  {{- end }}
  {{- if .Values.identity.issuer }}
  CUTBACK_OIDC_ISSUER: {{ .Values.identity.issuer | quote }}
  CUTBACK_OIDC_AUDIENCE: {{ required "identity.audience is required" .Values.identity.audience | quote }}
  CUTBACK_OIDC_JWKS_URL: {{ required "identity.jwksURL is required" .Values.identity.jwksURL | quote }}
  CUTBACK_OIDC_CLIENT_ID: {{ .Values.identity.clientID | quote }}
  CUTBACK_OIDC_AUTHORIZATION_URL: {{ .Values.identity.authorizationURL | quote }}
  CUTBACK_OIDC_TOKEN_URL: {{ .Values.identity.tokenURL | quote }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cutback.name" . }}
  labels: {{ include "cutback.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cutback.name" . }}
  labels: {{ include "cutback.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: collector
  ports: [{name: http, port: 8080, targetPort: http, protocol: TCP}]
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cutback.name" . }}
  labels: {{ include "cutback.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ required "Choose the installed TLS ingress class" .Values.ingress.className | quote }}
  tls:
    - hosts: [{{ required "ingress.host is required" .Values.ingress.host | quote }}]
      secretName: {{ required "Use an existing reviewed TLS certificate secret" .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "cutback.name" . }}
                port: {name: http}
{{- end }}
