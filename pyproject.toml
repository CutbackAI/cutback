[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "cutback"
version = "0.1.0.dev5"
description = "Independent, evidence-aware AI application cost observation and optimization"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["pydantic>=2.10.6,<3", "typer>=0.20,<1", "PyYAML>=6,<7", "pathspec>=1,<2"]

[project.urls]
Homepage = "https://github.com/CutbackAI/cutback"
Repository = "https://github.com/CutbackAI/cutback"
Issues = "https://github.com/CutbackAI/cutback/issues"
Documentation = "https://github.com/CutbackAI/cutback/tree/main/docs"

[project.optional-dependencies]
prompts = ["httpx>=0.28,<1"]
instrumentation = ["httpx>=0.28,<1", "opentelemetry-api>=1.38,<2"]
openai = ["cutback[instrumentation]", "openai==2.29.0"]
server = ["cutback[eval]", "httpcore==1.0.9", "fastapi>=0.120,<1", "uvicorn>=0.38,<1", "sqlalchemy>=2.0.44,<3", "alembic>=1.17,<2", "psycopg[binary]>=3.2,<4"]
eval = [
    "cryptography>=50,<51",
    "jsonschema>=4.25,<5",
]
anthropic = [
    "cutback[instrumentation]",
    "anthropic==2.3.0",
]
storage = [
    "boto3>=1.43.118",
]
identity = [
    "pyjwt[crypto]==2.15.1",
]
commercial = [
    "stripe==16.0.0",
]
javascript = [
    "tree-sitter==0.26.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
    "types-PyYAML>=6",
    "build>=1.3,<2",
    "pip-audit>=2.9,<3",
    "twine>=6,<7",
    "kubernetes-validate==1.37.0",
    "django==5.2.18",
]

[project.scripts]
cutback = "cutback.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cutback"]

[tool.hatch.build.targets.sdist]
include = [
  "/docs/testing-the-sample.md", "/docs/experiment-files.md", "/docs/evidence",
  "/docs/quickstart.md", "/docs/deployment.md", "/docs/providers.md",
  "/docs/limitations.md", "/docs/architecture.md", "/docs/security-and-privacy.md",
  "/docs/evaluation.md", "/docs/dependencies.md", "/docs/progress.md",
  "/docs/agent-integration.md", "/docs/demo.md", "/docs/product-completion.md",
  "/docs/product-research.md", "/docs/optimization-search.md",
  "/docs/market-baseline.md", "/docs/differentiation.md", "/docs/implementation-roadmap.md", "/docs/research",
  "/docs/workflow-tracing.md", "/docs/imports-and-review.md",
  "/docs/prompt-releases.md", "/docs/application-checks.md",
  "/docs/online-monitoring.md",
  "/docs/online-quality.md",
  "/docs/agent-evaluation.md",
  "/docs/task-economics.md",
  "/docs/improvement-campaigns.md",
  "/docs/campaign-outcomes.md",
  "/docs/load-qualification.md",
  "/docs/identity-and-teams.md", "/docs/hosted-billing.md", "/docs/continuous-operations.md",
  "/docs/advanced-optimization.md", "/docs/local-training.md", "/docs/adr", "/docs/assets", "/packages/js-sdk/index.mjs", "/packages/js-sdk/index.d.ts",
  "/packages/js-sdk/package.json", "/packages/js-sdk/package-lock.json",
  "/packages/js-sdk/README.md", "/packages/js-sdk/LICENSE", "/packages/js-sdk/NOTICE",
  "/packages/js-sdk/examples", "/packages/js-sdk/test",
  "/infra/README.md", "/infra/helm", "/infra/terraform/kubernetes/*.tf",
  "/infra/terraform/kubernetes/.terraform.lock.hcl", "/infra/terraform/kubernetes/tests",
  "/infra/training/Dockerfile", "/infra/training/pyproject.toml", "/infra/training/uv.lock",
  "/infra/sdk-compat",
  "/scripts/check_public_boundary.py", "/docs/application-onboarding.md", "/docs/agent-workflow.md",
  "/web/public", "/web/unit", "/scripts/create_training_fixture.py", "/scripts/scale_smoke.py",
  "/SECURITY.md", "/GOVERNANCE.md", "/.github", "/src", "/tests", "/examples", "/README.md", "/LICENSE", "/NOTICE",
  "/docs/audit-remediation.md", "/docs/otel-ingestion.md", "/docs/operating-and-recovering.md", "/scripts/check_toolchain.py", "/scripts/check_codeql_results.py", "/scripts/audit_training.py", "/scripts/image_acceptance.py", "/infra/training/.python-version",
  "/pyproject.toml", "/uv.lock", "/.python-version", "/scripts/wheel_smoke.py",
  '/web/src','/web/scripts','/web/tests','/web/package.json','/web/package-lock.json',
  '/web/openapi.json','/web/index.html','/web/tsconfig.json','/web/vite.config.ts',
  '/web/playwright.config.ts','/skills','/AGENTS.md','/CONTRIBUTING.md','/CHANGELOG.md',
  '/infra/compose/Dockerfile','/infra/compose/docker-compose.yml',
  '/infra/compose/docker-compose.tls.yml','/infra/compose/prepare.py','/infra/compose/Caddyfile',
  '/scripts/check.py','/scripts/demo.py','/scripts/export_openapi.py',
  '/scripts/generate_ts_client.py','/scripts/package_agent_workflows.py',
  '/scripts/backup_restore.py','/scripts/scanner_benchmark.py','/scripts/check_release_artifacts.py',
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["postgres: requires CUTBACK_TEST_DATABASE_URL", "e2e: local HTTP/PostgreSQL integration"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/cutback/server/api.py" = ["B008"] # FastAPI dependency defaults are its documented API.
"src/cutback/server/operations.py" = ["B008"]
"src/cutback/server/evaluation_api.py" = ["B008"]
"src/cutback/server/execution_api.py" = ["B008"]
"src/cutback/server/economics_api.py" = ["B008"]
"src/cutback/server/improvement_api.py" = ["B008"]
"src/cutback/server/campaign_api.py" = ["B008"]
"src/cutback/server/privacy_api.py" = ["B008"]
"src/cutback/server/organization_api.py" = ["B008"]
"src/cutback/server/continuous.py" = ["B008"]
"src/cutback/server/billing.py" = ["B008"]
"src/cutback/server/cache_api.py" = ["B008"]
"src/cutback/server/training_api.py" = ["B008"]
"src/cutback/server/case_evidence.py" = ["B008"]
"src/cutback/server/change_artifacts.py" = ["B008"]
"src/cutback/server/otel.py" = ["B008"]
"src/cutback/server/traces.py" = ["B008"]
"src/cutback/server/workflow_otel.py" = ["B008"]
"src/cutback/server/trace_content.py" = ["B008"]
"src/cutback/server/import_api.py" = ["B008"]
"src/cutback/server/review_api.py" = ["B008"]
"src/cutback/server/prompt_api.py" = ["B008"]
"src/cutback/server/prompt_alias_api.py" = ["B008"]
"src/cutback/server/prompt_playground.py" = ["B008"]
"src/cutback/server/prompt_observations.py" = ["B008"]
"src/cutback/server/monitoring_api.py" = ["B008"]
"src/cutback/server/notification_api.py" = ["B008"]
"src/cutback/server/quality_api.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["src/cutback"]
check_untyped_defs = true
ignore_missing_imports = true

